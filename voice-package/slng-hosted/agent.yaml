version: 1
name: sovereign-triage-slng
entry_agent: sovereign_triage

secrets:
  - GEMINI_API_KEY
  - GNANI_API_KEY
  - GOOGLE_API_KEY
  - SARVAM_API_KEY
  - SLNG_API_KEY

models:
  think:
    reasoning:
      description: "Google Gemini 2.5 Flash for sovereign triage reasoning"
      provider: google
      model: "gemini-2.5-flash"
  speak:
    voice:
      description: "SLNG Sovereign TTS Cartesia Sonic for natural voice"
      provider: slng
      model: "cartesia/sonic:3"
      voice: "sonic-english"
      params:
        world_part: in
  listen:
    transcriber:
      description: "SLNG Sovereign STT Deepgram Nova-3"
      provider: slng
      model: "deepgram/nova:3"
      params:
        world_part: in

agents:
  sovereign_triage:
    instructions: prompts/sovereign_triage.md
    think: reasoning
    speak: voice
    tools:
      - verify_and_log_incident
      - fetch_emergency_protocol
      - end_call

tools:
  - verify_and_log_incident
  - fetch_emergency_protocol
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Namaste. Sovereign Emergency and Compliance Dispatch on SLNG India. Please state your name, location, and what happened."
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
