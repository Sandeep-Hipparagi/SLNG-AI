[project]
name = "unmute-sovereign-triage-agent"
version = "0.1.0"
description = "Generated LiveKit Agents project (unmute livekit driver)"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "livekit-agents[google]==1.8.1",
    "livekit-plugins-silero>=1.8.1",
    "livekit-plugins-slng>=1.8.1",
    "python-dotenv",
]

[tool.uv]
# Copy packages into .venv, never hard-link them out of uv's cache. On Linux a
# hard-linked file has st_nlink=2, NLTK refuses to open it, and the knowledge
# index reads its stopword list through NLTK, so the agent dies at startup. The
# Dockerfile passes --link-mode=copy for the same reason. This line covers every
# local `uv run` and `uv sync` in this directory.
link-mode = "copy"

[dependency-groups]
dev = ["ruff==0.15.7", "ty"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "FURB", "RUF", "BLE", "D", "ANN"]
ignore = ["E501", "ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["D", "ANN"]
"logic/*" = ["D", "ANN"]

[tool.ty.environment]
python-version = "3.11"
